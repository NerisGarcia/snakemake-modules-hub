sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
dataset_name: "307627_ncbi_genomes"
annot_dir: "data/test/genomics/02_annotation"
genomics_results_dir: "data/test/genomics"
threads: 8

panaroo:
  clean_mode: "strict"
  alignment: "core"
  family_threshold: 0.7
  core_threshold: 0.9
  refind_mode: "default"
  aligner: "mafft"
  # Must equal <genomics_results_dir>/04_pangenome/<dataset_name>/core_<core_threshold>
  existing_pangenome_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes/core_0.9"

custom_alignment:
  core_sample_list: "data/test/genomics/307627_core_samples.txt"
  analysis_sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
  core_threshold: 0.9
  core_name: "v1"
  subsample_name: "only_isolates"
  realign_and_clean: true
  include_amas_summary: true

iqtree:
  model: "GTR+I+G"
  bootstrap: 1000
