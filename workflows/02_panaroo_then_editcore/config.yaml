dataset_name: "307627_ncbi_genomes"
sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
# Optional subsets; use false (or leave empty) when they do not apply. At least one enables the subset stage.
#   core_sample_list only      -> subcore.{dataset}.{threshold}
#   analysis_sample_list only  -> core_subsamp.{dataset}.{threshold}
#   both                       -> subcore_subsamp.{dataset}.{threshold}
# core_sample_list: samples that define the core genes. analysis_sample_list: samples kept in the outputs.
core_sample_list: "data/test/genomics/307627_core_samples.txt"
analysis_sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
annot_dir: "data/test/genomics/02_annotation"
# Results: {pangenome_dir}/core_{core_threshold} (Panaroo) and {pangenome_dir}/<subset name> (see above)
pangenome_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes"
core_threshold: 0.9
threads: 8

panaroo:
  clean_mode: "strict"
  alignment: "pan"
  family_threshold: 0.7
  refind_mode: "default"
  aligner: "mafft"

# Genes with >= min_variable_sites variable columns have sequences with > gap_seq_max gaps removed,
# are realigned with MAFFT and cleaned with HmmCleaner; the others keep their Panaroo alignment.
gene_alignment:
  min_variable_sites: 5
  gap_seq_max: 0.8
  hmmcleaner:
    extra_args: "--large -profile=leave-one-out"

iqtree:
  model: "GTR+I+G"
  bootstrap: 1000
  fast: false
