dataset_name: "307627_ncbi_genomes"   # optional label, recorded in params.txt

out_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes"

# Files from an existing Panaroo run made with alignment: "pan".
# This workflow never runs Panaroo.
panaroo:
  rtab: "data/test/genomics/04_pangenome/307627_ncbi_genomes/panaroo_original.core_90/gene_presence_absence.Rtab"
  roary: "data/test/genomics/04_pangenome/307627_ncbi_genomes/panaroo_original.core_90/gene_presence_absence_roary.csv"
  gene_sequences: "data/test/genomics/04_pangenome/307627_ncbi_genomes/panaroo_original.core_90/aligned_gene_sequences"

# At least one of the two lists is required.
# Folder name = {kind}.{label}.core_{pct}, pct = subcore.core_threshold x 100:
#   subcore.core_sample_list only       -> subcore.{label}.core_80
#   subsample.analysis_sample_list only -> subsamp.{label}.core_80
#   both                                -> subcore_subsamp.{subcore label}__{subsample label}.core_80
# label is required with its list and says what it is. A new label/list/threshold makes a new folder.
subcore:
  core_sample_list: "data/test/genomics/307627_core_samples.txt"
  core_threshold: 0.8
  label: "isolates_only"   # e.g. core defined from isolates only (no MAGs)

subsample:
  analysis_sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
  label: "all_samples"   # e.g. "cladeA1" for a clade subsample

# Genes with >= min_variable_sites variable columns have sequences with > gap_seq_max gaps removed,
# are realigned with MAFFT and cleaned with HmmCleaner; the others keep their input alignment.
gene_aln_cleaning:
  min_variable_sites: 5
  gap_seq_max: 0.8
  hmmcleaner:
    extra_args: "--large -profile=leave-one-out"

iqtree:
  model: "GTR+I+G"   # or "TEST" to pick the best model with ModelFinder
  bootstrap: 1000    # ignored while fast is true (IQ-TREE cannot combine them)
  fast: true



# Threads per program
threads:
  mafft: 8       # per-gene realignment (one job per gene; Snakemake --cores caps the total)
  snp_dists: 4   # snp-sites / snp-dists before the tree
  iqtree: 8