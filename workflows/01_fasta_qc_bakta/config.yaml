# One full fasta path per line (.fna/.fa/.fasta/.fas, optionally .gz).
# Sample name = basename without the extension.
genome_list: "data/test/genome_paths.txt"

genomics_results_dir: "data/test"
summary_table: "data/test/Wporifererum_ncbi.pipeline_summary.tsv"

# Set these to paths that exist on the machine you run on
bakta_db: "/path/to/bakta/db-light"
checkm2_db: "/path/to/CheckM2_database/uniref100.KO.1.dmnd"

busco_lineage: "bacteria_odb12"

threads:
  bakta: 4
  busco: 8
  quast: 16
  checkm2: 8