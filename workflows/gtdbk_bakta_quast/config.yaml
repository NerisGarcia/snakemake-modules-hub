genome_list: "data/test/genomics/genomes.txt"   # one sample name per line
fasta_dir: "data/test/genomics/fasta"           # {sample}.fna
results_dir: "data/results"

bakta_db: "/path/to/bakta/db-light"
gtdbtk_db: "/path/to/gtdbtk/release226"

gtdbtk:
  extension: fna
  skip_ani_screen: true
  pplacer_cpus: 1
  extra_args: ""

threads:
  bakta: 4
  quast: 16
  gtdbtk: 8