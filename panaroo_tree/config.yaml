
# One isolate ID per line; each isolate must have a GFF under annot_dir/{isolate}.gff3.
sample_list: "data/test/isolates.txt"

# Directory containing annotation outputs, with parent-level files such as {isolate}.gff3.
annot_dir: "data/test/genomes"

genomics_results_dir: "data/results"
threads: 8

panaroo:
  clean_mode: "strict"
  alignment: "core"
  family_threshold: 0.7
  core_threshold: 0.98
  refind_mode: "full"
  aligner: "mafft"

iqtree:
  model: "GTR+ASC"
  bootstrap: 1000
