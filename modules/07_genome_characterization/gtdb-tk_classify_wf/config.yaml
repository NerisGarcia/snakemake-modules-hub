# ---------------------------------------------------------------------------
# Module config template. Keep these variable names across all modules.
# Delete sections that do not apply; do not rename the ones you keep.
# ---------------------------------------------------------------------------

# Name of the dataset (used to name outputs)
dataset_name: Ravel_lab_isolate_collection

# --- Inputs ----------------------------------------------------------------
# File with one full path to each genome sample per line
genome_list: data/test/genomics/genome_paths.txt


# --- Outputs ---------------------------------------------------------------
# Directory where this module stores its results
out_dir: data/test/genomics/7_genome_characterization

# --- Databases and references ----------------------------------------------
# GTDB-Tk reference data directory (exported as GTDBTK_DATA_PATH, ~100 GB)
db_dir: /Users/ngarcia-gonzalez/Desktop/RESEARCH/snakemake-modules-hub/data/dbs/gtdbtk/release226
reference_file: null

# --- Tool parameters -------------------------------------------------------
# Tool-specific options, grouped under the tool name
gtdbtk:
  skip_ani_tree: true      # skip ANI tree placement
  pplacer_cpus: 1         # pplacer is RAM-heavy; keep low
  extra_args: ""

# --- Threads ---------------------------------------------------------------
threads: 8
