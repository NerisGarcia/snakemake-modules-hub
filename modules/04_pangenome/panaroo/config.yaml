# INPUT

# One isolate ID per line.
sample_file: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
dataset_name: "307627_ncbi_genomes"
input_dir: "data/test/genomics/02_annotation"
input_extension: ".gff3"

# OUTPUT 
# Results go to out_dir/panaroo/panaroo_original.core_{pct}/ (pct = core_threshold x 100);
# set run_name to use a different folder name.
out_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes"

# PANROO PARAMS:

clean_mode: "strict"
# alignment "pan" is required if panning to use downstream modules (like subcore or subsample)
alignment: "pan"
family_threshold: 0.7
core_threshold: 0.9
refind_mode: "default"
aligner: "mafft"

threads: 8
