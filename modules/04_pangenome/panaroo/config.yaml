# INPUT

# One isolate ID per line; each isolate must have a GFF under annot_dir/{isolate}.gff3.
sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
dataset_name: "307627_ncbi_genomes"
annot_dir: "data/test/genomics/02_annotation"

# OUTPUT 
# Results go to pangenome_dir/panaroo_original.core_{pct}/ (pct = core_threshold x 100);
# set run_name to use a different folder name.
pangenome_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes"

# PANROO PARAMS:

clean_mode: "strict"
# alignment "pan" is required if panning to use downstream modules (like subcore or subsample)
alignment: "pan"
family_threshold: 0.7
core_threshold: 0.9
refind_mode: "default"
aligner: "mafft"

threads: 8

