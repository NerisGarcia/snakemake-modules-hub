dataset_name: "307627_ncbi_genomes"
# Full dataset used for the Panaroo run (one isolate ID per line).
sample_file: "data/test/genomics/307627_ncbi_genomes_accessions.txt"
# The Panaroo run is read from {pangenome_dir}/{panaroo.run_name}.
pangenome_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes/panaroo"
out_dir: "data/test/genomics/04_pangenome/307627_ncbi_genomes"

panaroo:
  run_name: "panaroo_original.core_90"

# Optional lists; use false (or empty) when not applied, but at least one is required.
# Run name = {kind}.{label}.core_{pct}, pct = subcore.core_threshold x 100:
#   subcore list only    -> subcore.{subcore label}.core_{pct}
#   subsample list only  -> subsamp.{subsample label}.core_{pct}
#   both                 -> subcore_subsamp.{subcore label}__{subsample label}.core_{pct}
# Each list needs its label, which says what it is.
subcore:
  core_sample_list: "data/test/genomics/307627_core_samples.txt"   # samples that define the core genes
  core_threshold: 0.8
  label: "isolates_only"

subsample:
  analysis_sample_list: "data/test/genomics/307627_ncbi_genomes_accessions.txt"   # samples kept in the outputs
  label: "all_samples"
