# Alignment to build the tree from (core gene alignment, FASTA).
input_file: "data/test/genomics/04_pangenome/307627_ncbi_genomes/core_0.9/core_gene_alignment_filtered.aln"
# A filename prefix beneath out_dir/iqtree.
out_dir: "tests_runs/modules/iqtree"
prefix: "panaroo_original.core_90.gene_alignment_filtered"
threads: 8
# Substitution model; "TEST" runs ModelFinder first and uses the best model (reported in {prefix}.iqtree)
model: "GTR+I+G"
# Ultrafast bootstrap replicates; ignored when fast is true (IQ-TREE cannot combine them)
bootstrap: 1000
# true adds IQ-TREE's --fast search and skips bootstrap
fast: true
